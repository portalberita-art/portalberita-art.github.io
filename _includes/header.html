<!-- HEADER PORTAL BERITA ART -->
<header class="site-header">
  <div class="wrap header-row">

    <!-- LOGO WEBSITE -->
    <a class="brand"
       href="{{ '/' | relative_url }}"
       aria-label="Beranda Portal Berita Art">

      <img
        src="{{ '/assets/images/logo-portalberita.png' | relative_url }}"
        alt="Portal Berita Art"
        width="280"
        height="80"
        loading="eager">

    </a>

    <!-- MENU NAVIGASI -->
    <nav class="header-nav" aria-label="Navigasi utama">

      <a href="{{ '/' | relative_url }}">
        Beranda
      </a>

      <a href="{{ '/artikel/' | relative_url }}">
        Semua Artikel
      </a>

      <!-- ICON PENCARIAN -->
      <a href="{{ '/arsip/' | relative_url }}"
         class="nav-search"
         aria-label="Cari artikel di arsip"
         title="Cari Artikel">

        <svg xmlns="http://www.w3.org/2000/svg"
             width="22"
             height="22"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2.3"
             stroke-linecap="round"
             stroke-linejoin="round"
             aria-hidden="true">

          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-4-4"></path>

        </svg>

      </a>

    </nav>

  </div>
</header>
